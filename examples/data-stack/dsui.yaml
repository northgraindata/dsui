adapters:
  airflow:
    package: "@northgraindata/dsui-adapter-airflow"
  # Local workspace package, loaded in-process through the uniform loader.
  snowflake:
    package: "@northgraindata/dsui-adapter-snowflake"
  # Presentation overrides (all optional, keyed by adapter id):
  #
  #   snowflake:
  #     name: Snowflake
  #     description: Browse metadata and execute Snowflake SQL.
  #     iconUrl: https://example.com/snowflake.svg

services:
  - id: analytics
    adapter: snowflake
    name: Analytics warehouse
    connection:
      accountIdentifier: org-account
      token: ${SNOWFLAKE_TOKEN}
