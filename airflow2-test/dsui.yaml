adapters:
  airflow:
    package: "@northgraindata/dsui-adapter-airflow"

services:
  - id: airflow2-local
    adapter: airflow
    name: Airflow 2 (local test)
    connection:
      method: airflow-2
      baseUrl: http://localhost:8081
      username: ${AIRFLOW_USERNAME}
      password: ${AIRFLOW_PASSWORD}
