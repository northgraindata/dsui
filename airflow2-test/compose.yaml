# Single-container Airflow 2.10 deployment for exercising the DSUI adapter.
# Not for production: Basic auth, fixed credentials, and SQLite are dev-only.
services:
  airflow:
    image: apache/airflow:2.10.5-python3.12
    container_name: dsui-airflow2-test
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "10"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "admin"
      _AIRFLOW_WWW_USER_PASSWORD: "admin"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow2-home:/opt/airflow
    command: standalone
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--user",
          "admin:admin",
          "http://localhost:8080/api/v1/version",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  airflow2-home:
