name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v0.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag like v0.1.0 or v0.1.0-rc.1; got: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Test image dependency declarations
        run: bun test packages/server/test/image-dependencies.test.ts

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: Build npm package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: DSUI_VERSION="${RELEASE_TAG#v}" bun run package:npm

      - name: Build release image
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          docker build
          --build-arg DSUI_VERSION="${RELEASE_TAG#v}"
          --tag ghcr.io/northgraindata/dsui:release-check
          .

  publish:
    name: Publish Docker image, npm packages, and GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag like v0.1.0 or v0.1.0-rc.1; got: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release version
        id: release-version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        if: github.event_name == 'push'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/northgraindata/dsui
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
          flavor: latest=auto

      - name: Build and publish multi-architecture image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            DSUI_VERSION=${{ steps.release-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build npm package
        env:
          DSUI_VERSION: ${{ steps.release-version.outputs.version }}
        run: bun run package:npm

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm CLI release version
        run: npm install --global npm@11.19.1

      # Configure npm Trusted Publishing for northgraindata/dsui and release.yml.
      - name: Publish npm package with OIDC
        run: |
          env -u NODE_AUTH_TOKEN -u NPM_CONFIG_USERCONFIG \
            npm publish ./dist/npm \
              --registry=https://registry.npmjs.org \
              --access public \
              --loglevel silly

      - name: Dump npm debug log
        if: failure()
        run: |
          shopt -s nullglob
          for f in "$HOME"/.npm/_logs/*.log; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: bun run scripts/generate-release-notes.ts > release-notes.md

      - name: Add installation commands to release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo
            echo "## Install"
            echo
            echo 'Run locally with npx:'
            echo
            echo '```sh'
            echo "npx @northgraindata/dsui@${VERSION}"
            echo '```'
            echo
            echo 'Or run the isolated Docker image:'
            echo
            echo '```sh'
            echo "docker pull ghcr.io/northgraindata/dsui:${VERSION}"
            echo '```'
          } >> release-notes.md

      - name: Generate release banner
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: bun run scripts/generate-release-banner.ts "${RELEASE_TAG}" release-banner.png

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release-banner.png \
              --verify-tag \
              --title "dsui $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" release-banner.png \
              --verify-tag \
              --title "dsui $RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest
          fi
