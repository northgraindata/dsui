name: Product release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v0.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-product
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag like v0.1.0 or v0.1.0-rc.1; got: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Lint before release verification and packaging
        run: bun run lint

      - name: Test image dependency declarations
        run: bun test packages/server/test/image-dependencies.test.ts

      - name: Verify product
        run: |
          bun scripts/ci-layer.ts product typecheck
          bun scripts/ci-layer.ts product test

      - name: Build npm package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: DSUI_VERSION="${RELEASE_TAG#v}" bun run package:npm

      - name: Set up Node for npm packing verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install npm CLI release version
        run: npm install --global npm@11.19.1

      - name: Pack verified npm artifact
        run: |
          npm pack ./dist/npm --ignore-scripts --json --pack-destination dist > "$RUNNER_TEMP/npm-pack.json"
          mv "dist/$(jq -r '.[0].filename' "$RUNNER_TEMP/npm-pack.json")" dist/product.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-npm
          path: dist/product.tgz
          retention-days: 7


  publish:
    name: Publish Docker image, npm packages, and GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag like v0.1.0 or v0.1.0-rc.1; got: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release version
        id: release-version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        if: github.event_name == 'push'
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/northgraindata/dsui
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
          flavor: latest=auto

      - name: Build and publish multi-architecture image
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            DSUI_VERSION=${{ steps.release-version.outputs.version }}
          cache-from: type=gha,scope=product
          cache-to: type=gha,scope=product,mode=max

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: product-npm
          path: dist

      - name: Configure npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install npm CLI release version
        run: npm install --global npm@11.19.1

      # Configure npm Trusted Publishing for northgraindata/dsui and release.yml.
      - name: Publish verified npm artifact with OIDC
        run: bun scripts/publish-npm.ts dist/product.tgz @northgraindata/dsui '${{ steps.release-version.outputs.version }}'

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: bun run scripts/generate-release-notes.ts > release-notes.md

      - name: Add installation commands to release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo
            echo "## Install"
            echo
            echo 'Run locally with npx:'
            echo
            echo '```sh'
            echo "npx @northgraindata/dsui@${VERSION}"
            echo '```'
            echo
            echo 'Or run the isolated Docker image:'
            echo
            echo '```sh'
            echo "docker pull ghcr.io/northgraindata/dsui:${VERSION}"
            echo '```'
          } >> release-notes.md

      - name: Generate release banner
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: bun run scripts/generate-release-banner.ts "${RELEASE_TAG}" release-banner.png

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-banner.png --clobber
            exit 0
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release-banner.png \
              --verify-tag \
              --title "dsui $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" release-banner.png \
              --verify-tag \
              --title "dsui $RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest
          fi
