name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binaries:
    name: binary (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-13 }
          - { os: darwin, arch: arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: |
          os="${{ matrix.os }}"
          arch="${{ matrix.arch }}"
          case "$os/$arch" in
            linux/amd64|linux/arm64|darwin/amd64|darwin/arm64) ;;
            *) echo "Unsupported release target: $os/$arch" >&2; exit 2 ;;
          esac

          mkdir -p dist/release
          output="dist/release/dsui-${os}-${arch}"
          bun build packages/server/src/main.ts --compile --minify --target="bun-${os}-${arch}" --outfile "$output"
          chmod +x "$output"
          test -s "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: dsui-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || inputs.tag != '' }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist/release }
      - run: |
          directory="dist/release"
          mkdir -p "$directory/.staged"

          find "$directory" -type f -name 'dsui-*' ! -path "$directory/.staged/*" ! -name '*.tar.gz' ! -name '*.sha256' -exec cp {} "$directory/.staged/" \;
          for binary in "$directory"/.staged/dsui-*; do
            [ -f "$binary" ] || continue
            name="$(basename "$binary")"
            tar -C "$directory/.staged" -czf "$directory/${name}.tar.gz" "$name"
          done
          find "$directory" -maxdepth 1 -type f -name '*.tar.gz' -print0 | sort -z | xargs -0 sha256sum >"$directory/checksums.sha256"
          find "$directory/.staged" -maxdepth 1 -type f -delete
          rmdir "$directory/.staged"
      - uses: anchore/sbom-action@v0
        with:
          path: dist/release
          artifact-name: dsui-sbom.spdx.json
          output-file: dist/release/dsui-sbom.spdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/*
