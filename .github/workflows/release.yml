name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Docker image, npm packages, and GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag like v0.1.0 or v0.1.0-rc.1; got: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/northgraindata/dsui
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
          flavor: latest=auto

      - name: Set release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build npm package
        env:
          DSUI_VERSION: ${{ steps.release-version.outputs.version }}
        run: bun run package:npm

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./dist/npm --provenance --access public

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            DSUI_VERSION=${{ steps.release-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run scripts/generate-release-notes.ts > release-notes.md

      - name: Add installation commands to release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo
            echo "## Install"
            echo
            echo 'Recommended for local development, including dbt local:'
            echo
            echo '```sh'
            echo "npx dsui@${VERSION}"
            echo '```'
            echo
            echo 'Docker image for isolated deployments:'
            echo
            echo '```sh'
            echo "docker pull ghcr.io/northgraindata/dsui:${VERSION}"
            echo '```'
          } >> release-notes.md

      - name: Generate release banner
        run: bun run scripts/generate-release-banner.ts "${GITHUB_REF_NAME}" release-banner.png

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release-banner.png \
              --verify-tag \
              --title "dsui $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" release-banner.png \
              --verify-tag \
              --title "dsui $RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest
          fi
