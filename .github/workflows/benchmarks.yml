name: Delivery benchmarks

on:
  pull_request:
    paths:
      - Dockerfile
      - apps/web/**
      - packages/server/**
      - scripts/benchmarks/**
      - .github/workflows/benchmarks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: ./scripts/benchmarks/delivery.sh
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-benchmarks
          path: artifacts/benchmarks.json
