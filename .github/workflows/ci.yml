name: Product

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci-layer.yml
    with:
      layer: product
  ui:
    name: UI layout checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/gallery
      - name: Render every adapter page and check its layout
        run: bun run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-layout-report
          path: apps/gallery/playwright-report
          retention-days: 7
