name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: bun run test

  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      # Keep adapter conformance separate from the general test gate: an
      # adapter that compiles but fails the SDK contract is visible in CI.
      # The loop picks up every adapter package, present and future.
      - run: |
          for test_file in packages/adapter-*/test/*.test.ts; do
            [ -e "$test_file" ] || continue
            bun test "$test_file"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          for artifact in apps/site/dist/index.html apps/docs/dist/index.html; do
            if [ ! -s "$artifact" ]; then
              echo "Missing or empty static artifact: $artifact" >&2
              exit 1
            fi
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dsui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm dsui:ci version

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          compose_file="examples/data-stack/compose.yaml"
          docker compose -f "$compose_file" config -q

          # Example images are intentionally pinned, so a demo remains reproducible.
          if rg -n '^\s+image: .+:(latest|edge)$' "$compose_file"; then
            echo "Compose example must use immutable image tags." >&2
            exit 1
          fi

          for service in dsui trino kafka minio minio-init; do
            if ! docker compose -f "$compose_file" config --services | grep -Fxq "$service"; then
              echo "Compose example is missing required service: $service" >&2
              exit 1
            fi
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: bun audit

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: bun run --filter @northgraindata/dsui-web build
      # Emit measurements without a policy threshold. Thresholds belong in an
      # agreed performance budget, not in delivery automation guessed from today.
      - run: |
          test -d apps/web/dist
          find apps/web/dist -type f -print0 | sort -z | xargs -0 wc -c
